---
- name: Configure Join Commands on Master Node
  hosts: kube-control-plane[0] # Target the first control plane node
  become: yes
  tasks:
    - name: Retrieve Join Command
      shell: kubeadm token create --print-join-command
      register: join_command_raw

    - name: Set Join Command
      set_fact:
        join_command: "{{ join_command_raw.stdout_lines[0] }}"

    - name: Retrieve Control Certificate Key
      shell: kubeadm init phase upload-certs --upload-certs
      register: control_cert_key_raw

    - name: Set Control Certificate Key
      set_fact:
        control_cert_key: "{{ control_cert_key_raw.stdout_lines[2] }}"

- name: Join Control Nodes
  hosts: kube-control-plane[1:] # Target the other control plane nodes
  become: yes
  tasks:
    - name: Enable TCP port 6443 (On Master) is able to connect from Worker
      wait_for: "host={{ groups['kube-control-plane'][0] }} port=6443 timeout=1"
    - name: Join control plane to cluster
      shell: "{{ hostvars[groups['kube-control-plane'][0]].join_command }} --control-plane --certificate-key {{ hostvars[groups['kube-control-plane'][0]].control_cert_key }} >> control_joined.log"
      args:
        chdir: /home/{{ ansible_user }}
        creates: control_joined.log

- name: Join Worker Nodes
  hosts: kube-worker-nodes
  become: yes
  tasks:
    - name: Enable TCP port 6443 (On Master) is able to connect from Worker
      wait_for: "host={{ groups['kube-control-plane'][0] }} port=6443 timeout=1"

    - name: Join worker to cluster
      shell: "{{ hostvars[groups['kube-control-plane'][0]].join_command }} >> worker_joined.log"
      args:
        chdir: /home/{{ ansible_user }}
        creates: worker_joined.log
