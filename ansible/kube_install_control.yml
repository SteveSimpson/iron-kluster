---
- hosts: kube-control-plane[0] # Target the first control plane node
  become: yes
  tasks:
    - name: Create an Empty file for Kubeadm configuring
      copy:
        content: ""
        dest: /etc/kubernetes/kubeadm-config.yaml
        force: no

    - name: Configure container runtime
      blockinfile:
        path: /etc/kubernetes/kubeadm-config.yaml
        block: |
          kind: KubeletConfiguration
          apiVersion: kubelet.config.k8s.io/v1beta1
          runtimeRequestTimeout: "15m"
          cgroupDriver: "systemd"
          systemReserved:
            cpu: 100m
            memory: 350M
          kubeReserved:
            cpu: 100m
            memory: 50M
          enforceNodeAllocatable:
          - pods
          ---
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: ClusterConfiguration
          kubernetesVersion: stable
          controlPlaneEndpoint: "api.iron.lcsas.net:6443" # change this (see below)
          networking:
            podSubnet: "10.64.0.0/16"

    - name: Initialize the cluster
      shell: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml >> cluster_initialized.log
      args:
        chdir: /home/{{ ansible_user }}
        creates: cluster_initialized.log

    - name: Create Kubernetes config directory for ansible_user user
      ansible.builtin.file:
        path: /home/{{ ansible_user }}/.kube
        state: directory
        mode: '0700'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Copy kubeconfig to home directory
      ansible.builtin.copy:
        remote_src: true
        src: /etc/kubernetes/admin.conf
        dest: /home/{{ ansible_user }}/.kube/config
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Install packages required for first control plane node
      apt:
        name: "{{ item }}"
        state: present
        update_cache: no
      loop:
        - python3-kubernetes

    - name: Restart and enable kubelet service
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        enabled: yes

- hosts: kube-control-plane[0] # Target the first control plane node
  become: no
  tasks:
    - name: Install Calico CNI plugin
      kubernetes.core.k8s:
        state: present
        src: https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/tigera-operator.yaml

    - name: Apply Calico custom resources
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../helm/calico/calico-custom-resources.yaml')  | from_yaml_all }}"
