---
- hosts: all
  become: yes
  tasks:
    - name: Update apt cache and install common packages
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg-agent
        - software-properties-common
        - containerd
        - net-tools    # TODO: Remove after testing
        - jq           # TODO: Remove after testing
        - iputils-ping # TODO: Remove after testing
        - vim          # TODO: Remove after testing

    - name: Disable swap
      command: swapoff -a

    - name: Containerd modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/containerd.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'
        owner: root
        group: root

    - name: Load Containerd modules
      ansible.builtin.command:
        cmd: modprobe -a overlay br_netfilter 

    - name: Set required sysctl params for Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.ipv4.ip_forward                 = 1
          net.bridge.bridge-nf-call-ip6tables = 1
        mode: '0644'
        owner: root
        group: root 

    - name: Apply sysctl params without reboot
      ansible.builtin.command:
        cmd: sysctl --system  
  
    - name: Add Configuration directory for containerd
      ansible.builtin.file: 
        path: /etc/containerd
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Configure containerd
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml # Only run if the output file doesn't exist

    - name: Configuring Systemd cgroup driver for containerd
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: "            SystemdCgroup = false"
        line:   "            SystemdCgroup = true"

    - name: Configuring Systemd cgroup driver for containerd
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: '    sandbox_image = "registry\.k8s\.io/pause:.*"'   
        line:   '    sandbox_image = "registry.k8s.io/pause:3.10.1"'

    - name: Restart and enable containerd service
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: yes

    - name: Create Kubernetes install working directory
      ansible.builtin.file:
        path: /opt/iron_install
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Download Kubernetes GPG key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key
        dest: /opt/iron_install/Release.key.v1.34

    - name: Dearmor the GPG key
      ansible.builtin.command:
        cmd: gpg -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg --dearmor /opt/iron_install/Release.key.v1.34
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg # Only run if the output file doesn't exist

    - name: Ensure the keyrings file has correct permissions
      ansible.builtin.file:
        path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        state: file
        mode: '0644'
        owner: root
        group: root

    - name: Create the Kubernetes apt sources list
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /
        mode: '0644'
        owner: root
        group: root

    - name: Install Kubernetes components
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - kubelet
        - kubeadm
        - kubectl
